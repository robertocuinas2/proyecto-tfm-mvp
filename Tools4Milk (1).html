<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Tools4 Milk — Diseño UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Space Grotesk','DM Sans',sans-serif; background:#1a1a1a; }
  ::-webkit-scrollbar { width:6px; height:6px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:rgba(0,0,0,0.2); border-radius:3px; }
  button { font-family: inherit; }
  input, select, textarea { font-family: inherit; outline:none; }
  input:focus, select:focus, textarea:focus { border-color:#1B5E3B !important; }
</style>
</head>
<body>

<script src="t4m-api.js"></script>
<script src="t4m-data.js"></script>
<script type="text/babel" src="t4m-tv.jsx"></script>
<script type="text/babel" src="t4m-tablet.jsx"></script>
<script type="text/babel" src="t4m-control.jsx"></script>
<script type="text/babel" src="t4m-predictions.jsx"></script>
<script type="text/babel" src="t4m-leanfarming.jsx"></script>
<script type="text/babel" src="t4m-quality.jsx"></script>
<script type="text/babel" src="t4m-global.jsx"></script>
<script type="text/babel" src="t4m-integration.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "tvZone": "Paridera",
  "tabletZone": "ordeno",
  "showLabels": true
}/*EDITMODE-END*/;

/* ─── Label badge for artboards ─── */
function FrameLabel({ text, sub }) {
  return (
    <div style={{
      position:'absolute', top:-40, left:0,
      display:'flex', alignItems:'baseline', gap:8,
    }}>
      <span style={{fontSize:14,fontWeight:700,color:'#fff',letterSpacing:'-0.01em'}}>{text}</span>
      {sub && <span style={{fontSize:12,color:'rgba(255,255,255,0.4)'}}>{sub}</span>}
    </div>
  );
}

/* ─── Config screen placeholder ─── */
function ConfigZona() {
  const [zona, setZona] = React.useState('ordeno');
  const [tv, setTv] = React.useState(true);
  const [tab, setTab] = React.useState(true);
  const [inter, setInter] = React.useState(30);

  const s = { fontFamily:"'Space Grotesk','DM Sans',sans-serif",width:'1280px',height:'800px',overflow:'hidden',
    display:'grid',gridTemplateColumns:'280px 1fr',background:'#F2F5F3',color:'#0D1A10' };
  const inp = { width:'100%',border:'1.5px solid #DDE8E1',borderRadius:10,padding:'12px 14px',fontSize:15,fontFamily:'inherit',color:'#0D1A10',background:'#fff' };
  const lbl = { fontSize:11,letterSpacing:'0.1em',textTransform:'uppercase',color:'#5C7268',fontWeight:700,marginBottom:6,display:'block' };

  return (
    <div style={s}>
      {/* Sidebar */}
      <div style={{background:'#0D1A10',padding:'28px 20px',display:'flex',flexDirection:'column',gap:6}}>
        <div style={{marginBottom:20}}>
          <div style={{fontSize:17,fontWeight:700,color:'#fff'}}>Tools4 Milk</div>
          <div style={{fontSize:11,color:'rgba(255,255,255,0.35)',letterSpacing:'0.06em'}}>Configuración</div>
        </div>
        {['Pantallas por zona','Usuarios y turnos','Alertas y umbrales','Integraciones','Gestión global'].map((item,i)=>(
          <div key={i} style={{
            padding:'10px 14px',borderRadius:8,fontSize:13,
            color: i===0?'#34D471':'rgba(255,255,255,0.55)',
            background: i===0?'rgba(52,212,113,0.12)':'none',
            fontWeight: i===0?700:400, cursor:'pointer',
          }}>{item}</div>
        ))}
      </div>

      {/* Main */}
      <div style={{overflowY:'auto',padding:'32px'}}>
        <div style={{fontSize:22,fontWeight:700,marginBottom:6}}>Configurar pantalla de zona</div>
        <div style={{fontSize:14,color:'#5C7268',marginBottom:28}}>Personaliza la TV y tablet de cada zona de la explotación</div>

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:24}}>
          {/* Zona */}
          <div style={{gridColumn:'1/-1',background:'#fff',borderRadius:14,padding:'24px',border:'1.5px solid #DDE8E1'}}>
            <div style={{fontSize:15,fontWeight:700,marginBottom:16}}>Zona</div>
            <label style={lbl}>Seleccionar zona</label>
            <select value={zona} onChange={e=>setZona(e.target.value)} style={{...inp,marginBottom:16}}>
              {window.T4M.zones.map(z=><option key={z.id} value={z.id}>{z.name}</option>)}
            </select>
            <div style={{display:'flex',gap:16}}>
              <label style={{display:'flex',alignItems:'center',gap:10,cursor:'pointer'}}>
                <input type="checkbox" checked={tv} onChange={e=>setTv(e.target.checked)} style={{width:20,height:20,accentColor:'#1B5E3B'}}/>
                <span style={{fontSize:14,fontWeight:600}}>Tiene pantalla TV</span>
              </label>
              <label style={{display:'flex',alignItems:'center',gap:10,cursor:'pointer'}}>
                <input type="checkbox" checked={tab} onChange={e=>setTab(e.target.checked)} style={{width:20,height:20,accentColor:'#1B5E3B'}}/>
                <span style={{fontSize:14,fontWeight:600}}>Tiene tablet</span>
              </label>
            </div>
          </div>

          {/* TV config */}
          <div style={{background:'#fff',borderRadius:14,padding:'24px',border:'1.5px solid #DDE8E1'}}>
            <div style={{fontSize:15,fontWeight:700,marginBottom:16}}>📺 Configuración TV</div>
            <label style={lbl}>Intervalo de actualización (seg)</label>
            <input type="range" min={10} max={120} step={10} value={inter} onChange={e=>setInter(+e.target.value)}
              style={{width:'100%',accentColor:'#1B5E3B',marginBottom:8}}/>
            <div style={{fontSize:13,color:'#5C7268',marginBottom:16}}>Cada <strong style={{color:'#1B5E3B'}}>{inter}s</strong></div>
            <label style={lbl}>Módulos visibles</label>
            {['Alertas críticas','Animales prioritarios','Tareas en curso','Métricas de zona','Próximas acciones'].map(m=>(
              <label key={m} style={{display:'flex',alignItems:'center',gap:10,marginBottom:8,cursor:'pointer'}}>
                <input type="checkbox" defaultChecked style={{width:16,height:16,accentColor:'#1B5E3B'}}/>
                <span style={{fontSize:14}}>{m}</span>
              </label>
            ))}
          </div>

          {/* Tablet config */}
          <div style={{background:'#fff',borderRadius:14,padding:'24px',border:'1.5px solid #DDE8E1'}}>
            <div style={{fontSize:15,fontWeight:700,marginBottom:16}}>📱 Configuración Tablet</div>
            <label style={lbl}>Acciones rápidas visibles</label>
            {['Registrar producción','Nueva alerta','Buscar animal','Confirmar tarea','Añadir nota','Alerta manual'].map(m=>(
              <label key={m} style={{display:'flex',alignItems:'center',gap:10,marginBottom:8,cursor:'pointer'}}>
                <input type="checkbox" defaultChecked style={{width:16,height:16,accentColor:'#1B5E3B'}}/>
                <span style={{fontSize:14}}>{m}</span>
              </label>
            ))}
            <label style={{...lbl,marginTop:16}}>Usuario asignado por defecto</label>
            <input defaultValue="Laura Fernández" style={inp}/>
          </div>

          {/* Save */}
          <div style={{gridColumn:'1/-1',display:'flex',justifyContent:'flex-end',gap:12}}>
            <button style={{padding:'12px 24px',borderRadius:10,border:'1.5px solid #DDE8E1',background:'#fff',color:'#0D1A10',fontSize:14,fontWeight:600,cursor:'pointer'}}>Cancelar</button>
            <button style={{padding:'12px 28px',borderRadius:10,border:'none',background:'#1B5E3B',color:'#fff',fontSize:14,fontWeight:700,cursor:'pointer',boxShadow:'0 4px 14px #1B5E3B44'}}>Guardar configuración</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ─── Main App ─── */
function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const zonesWithData = window.T4M.zones.filter(z=>window.T4M.zoneData[z.id]);
  const zoneNames = zonesWithData.map(z=>z.name);

  // Convert tweak zone name → id
  const tvZoneId  = React.useMemo(()=> zonesWithData.find(z=>z.name===tweaks.tvZone)?.id  || 'ordeno', [tweaks.tvZone]);
  const tabZoneId = React.useMemo(()=> zonesWithData.find(z=>z.name===tweaks.tabletZone)?.id || 'ordeno', [tweaks.tabletZone]);
  const tvLabel   = tweaks.tvZone  || 'Sala de Ordeño';
  const tabLabel  = tweaks.tabletZone || 'Sala de Ordeño';

  const [apiStatus, setApiStatus] = React.useState(window.T4MApi?.status || 'checking');
  React.useEffect(() => {
    if (!window.T4MApi) return;
    return window.T4MApi.onChange(({ status }) => setApiStatus(status));
  }, []);
  const apiDot = { connected:'#34D471', offline:'#94A3B8', error:'#FF5252', checking:'#FFA726' }[apiStatus] || '#94A3B8';
  const apiLabel = { connected:'Backend conectado', offline:'Modo mock', error:'Error conexión', checking:'Comprobando…' }[apiStatus];

  return (
    <>
      <DesignCanvas>

        {/* ══ SECCIÓN 0: VISTA DINÁMICA (responde a Tweaks) ══ */}
        <DCSection id="dynamic" title="Vista Dinámica — selector de zona">
          <DCArtboard id="tv-dynamic" label={`TV — ${tvLabel}`} width={1920} height={1080}>
            <TVView zoneId={tvZoneId}/>
          </DCArtboard>
          <DCArtboard id="tab-dynamic" label={`Tablet — ${tabLabel}`} width={768} height={1024}>
            <TabletView zoneId={tabZoneId}/>
          </DCArtboard>
        </DCSection>

        {/* ══ SECCIÓN 1: CONTROL CENTER ══ */}
        <DCSection id="cc" title="Centro de Control">
          <DCArtboard id="cc-main" label="Centro de Control General" width={1440} height={900}>
            <ControlCenter/>
          </DCArtboard>
        </DCSection>

        {/* ══ SECCIÓN 2: SALA DE ORDEÑO ══ */}
        <DCSection id="ordeno" title="Sala de Ordeño">
          <DCArtboard id="tv-ordeno" label="TV — Sala de Ordeño" width={1920} height={1080}>
            <TVView zoneId="ordeno"/>
          </DCArtboard>
          <DCArtboard id="tab-ordeno" label="Tablet — Sala de Ordeño" width={768} height={1024}>
            <TabletView zoneId="ordeno"/>
          </DCArtboard>
        </DCSection>

        {/* ══ SECCIÓN 3: ENFERMERÍA ══ */}
        <DCSection id="enfermeria" title="Enfermería">
          <DCArtboard id="tv-enfermeria" label="TV — Enfermería" width={1920} height={1080}>
            <TVView zoneId="enfermeria"/>
          </DCArtboard>
          <DCArtboard id="tab-enfermeria" label="Tablet — Enfermería" width={768} height={1024}>
            <TabletView zoneId="enfermeria"/>
          </DCArtboard>
        </DCSection>

        {/* ══ SECCIÓN 4: RECRÍA ══ */}
        <DCSection id="recria" title="Recría">
          <DCArtboard id="tv-recria" label="TV — Recría" width={1920} height={1080}>
            <TVView zoneId="recria"/>
          </DCArtboard>
          <DCArtboard id="tab-recria" label="Tablet — Recría" width={768} height={1024}>
            <TabletView zoneId="recria"/>
          </DCArtboard>
        </DCSection>

        {/* ══ SECCIÓN 4: RECRÍA ══ */}
        <DCSection id="recria" title="Recría">
          <DCArtboard id="tv-recria" label="TV — Recría" width={1920} height={1080}>
            <TVView zoneId="recria"/>
          </DCArtboard>
          <DCArtboard id="tab-recria" label="Tablet — Recría" width={768} height={1024}>
            <TabletView zoneId="recria"/>
          </DCArtboard>
        </DCSection>

        {/* ══ SECCIÓN 5: PARIDERA ══ */}
        <DCSection id="paridera" title="Paridera">
          <DCArtboard id="tv-paridera-esp" label="TV — Paridera (especializada)" width={1920} height={1080}>
            <TVPariedera/>
          </DCArtboard>
          <DCArtboard id="tv-paridera" label="TV — Paridera (genérica)" width={1920} height={1080}>
            <TVView zoneId="paridera"/>
          </DCArtboard>
          <DCArtboard id="tab-paridera" label="Tablet — Paridera" width={768} height={1024}>
            <TabletView zoneId="paridera"/>
          </DCArtboard>
        </DCSection>

        {/* ══ SECCIÓN 6: ALIMENTACIÓN ══ */}
        <DCSection id="alimentacion" title="Alimentación">
          <DCArtboard id="tv-alimentacion" label="TV — Alimentación" width={1920} height={1080}>
            <TVView zoneId="alimentacion"/>
          </DCArtboard>
          <DCArtboard id="tab-alimentacion" label="Tablet — Alimentación" width={768} height={1024}>
            <TabletView zoneId="alimentacion"/>
          </DCArtboard>
        </DCSection>

        {/* ══ SECCIÓN 7: PREDICCIONES ══ */}
        <DCSection id="predicciones" title="Predicciones">
          <DCArtboard id="pred-dashboard" label="Dashboard de Predicciones" width={1440} height={900}>
            <PredictionsDashboard/>
          </DCArtboard>
        </DCSection>

        {/* ══ SECCIÓN 8: LEANFARMING ══ */}
        <DCSection id="leanfarming" title="LeanFarming — Gestión de Turnos">
          <DCArtboard id="lean-tablero" label="TV — Tablero de Turnos" width={1920} height={1080}>
            <TableroTurnos/>
          </DCArtboard>
          <DCArtboard id="lean-cambio" label="Tablet — Cambio de Turno" width={768} height={1024}>
            <CambioTurno/>
          </DCArtboard>
        </DCSection>

        {/* ══ SECCIÓN 9: CALIDAD DE LECHE ══ */}
        <DCSection id="calidad" title="Calidad de Leche">
          <DCArtboard id="cal-dashboard" label="Dashboard Calidad" width={1440} height={900}>
            <CalidadDashboard/>
          </DCArtboard>
          <DCArtboard id="cal-carta" label="Leche a la Carta" width={1440} height={900}>
            <LecheACarta/>
          </DCArtboard>
        </DCSection>

        {/* ══ SECCIÓN 7: PATIO + MAQUINARIA ══ */}
        <DCSection id="patio-maq" title="Patio / Maquinaria">
          <DCArtboard id="tv-patio" label="TV — Patio / Estabulación" width={1920} height={1080}>
            <TVView zoneId="patio"/>
          </DCArtboard>
          <DCArtboard id="tab-patio" label="Tablet — Patio" width={768} height={1024}>
            <TabletView zoneId="patio"/>
          </DCArtboard>
          <DCArtboard id="tv-maquinaria" label="TV — Maquinaria" width={1920} height={1080}>
            <TVView zoneId="maquinaria"/>
          </DCArtboard>
          <DCArtboard id="tab-maquinaria" label="Tablet — Maquinaria" width={768} height={1024}>
            <TabletView zoneId="maquinaria"/>
          </DCArtboard>
          <DCArtboard id="tv-almacen" label="TV — Almacén" width={1920} height={1080}>
            <TVView zoneId="almacen"/>
          </DCArtboard>
        </DCSection>

        {/* ══ SECCIÓN 8: FLUJOS TABLET ══ */}
        <DCSection id="flows" title="Flujos de tablet">
          <DCArtboard id="flow-animal" label="Ficha rápida de animal" width={768} height={1024}>
            <AnimalFicha/>
          </DCArtboard>
          <DCArtboard id="flow-incidencia" label="Crear incidencia" width={768} height={1024}>
            <CrearIncidencia/>
          </DCArtboard>
          <DCArtboard id="flow-completar" label="Completar tarea" width={768} height={1024}>
            <CompletarTarea/>
          </DCArtboard>
          <DCArtboard id="flow-alerta" label="Revisar alerta" width={768} height={1024}>
            <RevisarAlerta/>
          </DCArtboard>
        </DCSection>

        {/* ══ SECCIÓN 10: INTEGRACIÓN API ══ */}
        <DCSection id="api" title="Integración con Backend FastAPI">
          <DCArtboard id="api-dashboard" label="Panel de Integración API" width={1440} height={900}>
            <IntegrationDashboard/>
          </DCArtboard>
        </DCSection>

        {/* ══ SECCIÓN 11: GESTIÓN GLOBAL ══ */}}
        <DCSection id="gestion" title="Gestión Global">
          <DCArtboard id="login" label="Login / Pantalla de inicio" width={1440} height={900}>
            <LoginScreen/>
          </DCArtboard>
          <DCArtboard id="gestion-global" label="Gestión Global — Inventario y Pedidos" width={1440} height={900}>
            <GestionGlobal/>
          </DCArtboard>
          <DCArtboard id="informe" label="Informe Semanal" width={1440} height={900}>
            <InformeSemanal/>
          </DCArtboard>
        </DCSection>

        {/* ══ SECCIÓN 11: CONFIGURACIÓN ══ */}
        <DCSection id="config" title="Configuración">
          <DCArtboard id="config-zona" label="Configurar pantalla de zona" width={1280} height={800}>
            <ConfigZona/>
          </DCArtboard>
        </DCSection>

      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Conexión">
          <div style={{display:'flex',alignItems:'center',gap:8,padding:'6px 0',fontSize:13}}>
            <div style={{width:8,height:8,borderRadius:'50%',background:apiDot,boxShadow:`0 0 6px ${apiDot}88`}}/>
            <span style={{color:'#cbd5e1'}}>{apiLabel}</span>
          </div>
          <div style={{fontSize:11,color:'#64748b',marginTop:4}}>localhost:8000</div>
        </TweakSection>
        <TweakSection label="Vista Dinámica — TV">
          <TweakSelect label="Zona activa TV" value={tweaks.tvZone} options={zoneNames} onChange={v=>setTweak('tvZone',v)}/>
        </TweakSection>
        <TweakSection label="Vista Dinámica — Tablet">
          <TweakSelect label="Zona activa Tablet" value={tweaks.tabletZone} options={zoneNames} onChange={v=>setTweak('tabletZone',v)}/>
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<div id="root"></div>
</body>
</html>
